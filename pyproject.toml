[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "F403",   # star imports used for public API exposure
    "F405",   # may be undefined from star imports
    "F811",   # redefinition - needed for @dispatch overloading (multipledispatch)
    "W291",   # trailing whitespace in docstring examples
    "UP008",  # super() call with parameters - keep existing style
    "C416",   # unnecessary list comprehension - keep existing style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C4", "E402"]
"__init__.py" = ["F401"]  # unused imports in __init__.py are often intentional for re-export

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
